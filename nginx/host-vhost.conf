# ─────────────────────────────────────────────────────────────
# nginx del HOST (instalado en el VPS, no en Docker): termina el HTTPS y reenvía
# al puerto que el contenedor publica en 127.0.0.1.
# Cadena: Internet → aquí (:443) → 127.0.0.1:8081 → contenedor (proxy.conf o static.conf)
#
# Va en /etc/nginx/sites-available/<dominio> + enlace en sites-enabled.
# Certificado:  certbot certonly --webroot -w /var/www/certbot -d example.com -d www.example.com
# Comprobar:    nginx -t && systemctl reload nginx
#
# NO hace falta si se usa Cloudflare Tunnel (panchi-bot): ahí el HTTPS lo pone Cloudflare.
# Aquí SOLO va lo del TLS (y HSTS). El resto de cabeceras de seguridad las pone el
# nginx del contenedor: si se repiten aquí, el navegador las recibe duplicadas.
# ─────────────────────────────────────────────────────────────

# ── Lo que no sea mi dominio (escaneos por IP, dominios ajenos apuntando aquí) ──
# Un solo bloque de estos por VPS, no uno por proyecto (default_server solo puede haber uno).
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;        # corta el TLS sin enseñar ningún certificado (nginx ≥ 1.19.4)
    return 444;                     # HTTP: cierra la conexión sin responder
}

# ── HTTP → HTTPS (y el reto de certbot, que entra por HTTP) ──
server {
    listen 80;
    server_name example.com www.example.com;    # ← TU dominio

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.example.com$request_uri;
    }
}

# ── Sin www → con www ──
server {
    listen 443 ssl;
    http2 on;                       # nginx ≥ 1.25.1. En versiones anteriores: "listen 443 ssl http2;"
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://www.example.com$request_uri;
}

# ── Servidor principal ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    server_tokens off;

    # ── TLS (perfil "intermediate" de Mozilla: https://ssl-config.mozilla.org) ──
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: el navegador solo usará HTTPS durante 1 año. Empezar SIN includeSubDomains;
    # añadirlo cuando todos los subdominios tengan HTTPS (no se puede deshacer rápido).
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;        # igual o mayor que el del contenedor

    location / {
        proxy_pass http://127.0.0.1:8081;       # ← puerto que publica el compose
        proxy_set_header Host              $host;
        # X-Real-IP se SOBRESCRIBE aquí con la IP de la conexión: el contenedor se fía de
        # ella (real_ip_header X-Real-IP), así que el visitante no puede colar la suya.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;                 # un poco más que el del contenedor
    }
}

# Con Cloudflare en modo proxy (nube naranja) DELANTE de este nginx, $remote_addr sería
# una IP de Cloudflare. En ese caso, en el servidor principal:
#   set_real_ip_from <cada rango de https://www.cloudflare.com/ips/>;
#   real_ip_header   CF-Connecting-IP;
# y en el firewall permitir 80/443 SOLO desde esos rangos (si no, se puede entrar por la
# IP del VPS saltándose Cloudflare y falseando la cabecera).
