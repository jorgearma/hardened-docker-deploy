# ─────────────────────────────────────────────────────────────
# nginx en contenedor DELANTE de una app (gunicorn, node...). Sacado de panchi-bot.
# Cadena: Internet → [Cloudflare Tunnel | nginx del host (host-vhost.conf)] (HTTPS)
#         → 127.0.0.1:8081 → aquí (:8080) → app:8000
# nginx-unprivileged (uid 101): escucha en 8080, sin capabilities.
# Sin TLS ni certbot: el HTTPS (y HSTS) va donde se termina el TLS, no aquí.
# Se monta en /etc/nginx/conf.d/default.conf → ver ../compose/compose.proxy-app-db.yml
# ─────────────────────────────────────────────────────────────

# ── IP real del visitante ──
# Lo que entra por el puerto publicado en 127.0.0.1 llega con la IP del GATEWAY de
# web_net (fijado en el compose). Solo de ahí se acepta la cabecera: si se confiara en
# toda la subred (o en 172.16.0.0/12), cualquier contenedor podría falsear su IP y
# saltarse el rate limit. Si se cambia la subred en el compose, cambiarla también aquí.
# (cloudflared como contenedor dentro de web_net → poner su IP o la subred.)
set_real_ip_from 172.30.80.1;
real_ip_header   X-Real-IP;          # nginx del host | CF-Connecting-IP si es Cloudflare Tunnel

server_tokens off;

# ── Rate limit del login (anti fuerza bruta): 10 intentos/min por IP real ──
# Funciona porque realip ya ha puesto la IP del VISITANTE en $binary_remote_addr.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# ── Cache-Control: no-store en todo menos /static/ ──
# El navegador no guarda páginas con datos de sesión. Valor vacío = no se añade la cabecera.
# Si la app ya manda su propio Cache-Control saldrían dos → quitar uno de los dos.
map $uri $cache_control {
    ~^/static/  "";
    default     "no-store";
}

# ── WebSocket (solo si la app lo usa; ver location /ws/ más abajo) ──
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# ── Cualquier Host que no sea el mío → se corta la conexión (444) ──
# Sin esto, un Host falso llega a la app (enlaces de "recuperar contraseña" envenenados,
# caché...). También responde al healthcheck, que entra por 127.0.0.1 → mide nginx, no la app.
server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 204;
    }
    location / {
        return 444;
    }
}

# ── Sin www → con www (opcional) ──
# server {
#     listen 8080;
#     server_name example.com;
#     return 301 https://www.example.com$request_uri;
# }

# ── Servidor principal ──
server {
    listen 8080;
    server_name www.example.com localhost;      # ← TU dominio (localhost: pruebas en local)

    # ── Cabeceras de seguridad ──
    # OJO: ninguna location puede tener add_header, o anularía todas estas.
    # CSP en Report-Only: avisa en la consola del navegador pero no bloquea. Hacer inventario
    # de lo que carga la app (CDNs, fuentes, APIs), ajustar y pasar a Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # ── Lo que se le manda a la app ──
    # Aquí y NO en cada location: se heredan mientras la location no defina ningún
    # proxy_set_header propio (misma trampa que add_header).
    proxy_set_header Host              $host;
    # $remote_addr ya es la IP real (realip). Se manda UN solo valor:
    # ProxyFix(x_for=1) en Flask toma el último → el del cliente, no el de Docker.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    # Solo se llega por el túnel / nginx del host → siempre HTTPS de cara al cliente
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;

    # ── Límites y tiempos ──
    client_max_body_size  1m;       # subidas: subirlo, pero SIEMPRE por debajo del tmpfs /tmp (se guardan ahí)
    client_header_timeout 15s;      # clientes lentos a propósito (slowloris)
    client_body_timeout   15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;      # = timeout de gunicorn
    proxy_send_timeout    30s;

    # Contacto para quien encuentre una vulnerabilidad (RFC 9116).
    # Expires: obligatorio y a menos de 1 año vista → renovarlo.
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:<TU_EMAIL>\nExpires: <AAAA-MM-DD>T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # Ficheros ocultos (.git, .env...) → 404 sin llegar a la app, salvo .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Extensiones que una app nunca debería servir → 404 sin llegar a la app.
    # Si la app ofrece descargas con alguna de estas, quitarla de la lista.
    location ~* \.(env|ini|log|bak|sql|old|swp|pyc)$ {
        return 404;
    }

    # Login: rate limit (burst 5 = margen para quien se equivoca un par de veces)
    location = /auth/login {                    # ← la ruta de login de TU app
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
    }

    # Healthcheck de la app: sin ensuciar el log. Es público (solo dice ok / error).
    location = /health {
        access_log off;
        proxy_pass http://app:8000;
    }

    # WebSocket: al definir proxy_set_header aquí se dejan de heredar los del server
    # → hay que repetirlos TODOS.
    # location ^~ /ws/ {
    #     proxy_pass http://app:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        $connection_upgrade;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $remote_addr;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_read_timeout 1h;                # conexión larga
    # }

    location / {
        proxy_pass http://app:8000;
    }
}
