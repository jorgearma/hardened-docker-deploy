server {
    listen       8080;          # >1024 → sin capabilities
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    server_tokens off;          # "Server: nginx" sin versión

    # ── Solo si hay un proxy/CDN delante que manda la IP real ──
    # Fiarse de la cabecera SOLO desde la red propia del contenedor (subred del compose).
    # set_real_ip_from 172.30.X.0/24;     # subred del compose
    # real_ip_header   CF-Connecting-IP;    # Cloudflare | X-Forwarded-For (otro proxy)

    # Web estática: solo lectura. POST, PUT, DELETE, TRACE... → 405
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ── Cabeceras de seguridad ──
    # OJO: si una location define add_header, NO hereda estas → no poner add_header en locations.
    # "always" = también en 404/405.
    # CSP: empezar con Content-Security-Policy-Report-Only, revisar consola, luego activar.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # HSTS: ponerlo donde se termina el HTTPS (Cloudflare o nginx del host), no aquí.

    # ── Compresión ──
    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── security.txt (RFC 9116) — Expires a menos de 1 año, renovarlo ──
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:<TU_EMAIL>\nExpires: <AAAA-MM-DD>T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # Ficheros ocultos (.git, .env...) → 404, salvo .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Extensiones sensibles → 404 (defensa por si algún día se copian por error)
    location ~* \.(env|ini|log|bak|sql|tar|gz|zip|old|swp|map)$ {
        return 404;
    }

    # Vite pone hash en el nombre (index-3f9a1c.js) → si cambia el contenido cambia
    # el nombre, así que se puede cachear 1 año sin miedo a servir versiones viejas.
    # ^~ = si casa este prefijo, nginx NO evalúa las location con regex de abajo.
    # Por eso los dos bloqueos de arriba se repiten DENTRO: si no, /assets/.env o
    # /assets/dump.sql se servirían. Si se cambia una lista, cambiar también la otra.
    location ^~ /assets/ {
        location ~ /\. {
            return 404;
        }
        location ~* \.(env|ini|log|bak|sql|tar|gz|zip|old|swp|map)$ {
            return 404;
        }
        expires 1y;
        try_files $uri =404;
    }

    # Resto de assets (los de public/, sin hash): caché media
    location ~* \.(css|js|woff2?|ttf|ico|png|jpe?g|gif|webp|svg|avif)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML: caché corta. Lo que no existe → 404 real
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
        # SPA (React Router, Vue Router...): las rutas /about no existen como fichero →
        # cambiar la línea anterior por:  try_files $uri $uri/ /index.html;
    }
}
